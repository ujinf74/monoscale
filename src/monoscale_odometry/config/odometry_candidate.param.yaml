feature_tracker:
  ros__parameters:
    processing_width: 640
    max_features_per_camera: 1600
    detection_grid_columns: 4
    detection_grid_rows: 3
    lk_window_px: 15
    lk_pyramid_levels: 4
    lk_forward_backward_threshold_px: 1.0
    lk_error_threshold: 30.0
    input_reliability: best_effort
    input_queue_depth: 30
    output_reliability: reliable
    output_queue_depth: 200
    image_topics:
      - /sensing/camera/front/fisheye/image_raw
      - /sensing/camera/rear/fisheye/image_raw

monoscale_odometry:
  ros__parameters:
    processing_width: 640
    max_features_per_camera: 1600
    detection_grid_columns: 4
    detection_grid_rows: 3
    track_topic_prefix: /vision/tracks
    input_reliability: reliable
    input_queue_depth: 200
    use_inertial_prediction: true
    # See vision_fisheye.param.yaml: on, decided by a controlled A/B where
    # both arms shared one tracker. Legacy 600 Hz-physics bags must still be
    # scored with `--acceleration false`; their IMU is not a signal.
    inertial_max_acceleration_mps2: 12.0
    inertial_acceleration_median_window: 1
    inertial_integration_method: rk4
