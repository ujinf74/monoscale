/**:
  ros__parameters:
    # Where the labelled points come from and where the grid goes.
    ground_points_topic: /perception/ground_points
    occupancy_topic: /perception/occupancy_grid_map
    map_frame: map

    # Cells live in tiles allocated where something is seen, so nothing here
    # bounds the map. What used to sit in this block was a 600 x 600 window at
    # 10 cm anchored on the start of the run -- sized for a parking manoeuvre,
    # and on a road drive it silently dropped every point beyond 30 m. Measured
    # 08-18 with the car at x = 30.35 m: 49% of the ground points arriving were
    # being discarded.
    #
    # The structure and these values come from pointcloud_ogm_accumulator in
    # ioniq-autopark-ws, which was validated against a LiDAR reference. Its
    # scales are converted: a free observation is 20 there and 0.45 here, so
    # its gc threshold of 6 becomes 0.135 and its decay of 1.0/s becomes
    # 0.0225/s.
    map_resolution: 0.1
    map_origin_x: 0.0
    map_origin_y: 0.0
    # 64 cells is 6.4 m, the ground a tile covers in the reference at its
    # coarser resolution. 15 tiles across is a 96 m ceiling on the published
    # window; what actually goes out is cropped to the tiles carrying evidence,
    # so the map starts small and grows with the drive.
    tile_size_cells: 64
    roi_tiles_x: 15
    roi_tiles_y: 15
    # Off. The reference settled 1.0/s (0.0225 here) against a LiDAR returning
    # thousands of points at 10 Hz; vision carves far fewer and the same rate
    # would erase the map faster than it is drawn. Turn it on for a scene with
    # moving obstacles, where free space going stale is a hazard.
    decay_log_odds_per_sec: 0.0
    collect_min_abs_log_odds: 0.135
    collect_min_age_sec: 3.0
    tile_forget_sec: 60.0

    # Evidence per observation, and the probabilities a cell has to reach
    # before it is called one thing or the other.
    free_log_odds_update: 0.45
    occupied_log_odds_update: 0.9
    occupied_probability_threshold: 0.65
    free_probability_threshold: 0.35

    obstacle_inflation_radius_m: 0.25
    free_ray_stride: 4
    occupancy_publish_rate_hz: 5.0
